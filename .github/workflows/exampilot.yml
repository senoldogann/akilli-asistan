name: ExamPilot

on:
  push:
    branches:
      - main
      - feat/exampilot-visual-agent
    paths:
      - 'ExamPilot/**'
      - '.github/workflows/exampilot.yml'
  pull_request:
    paths:
      - 'ExamPilot/**'
      - '.github/workflows/exampilot.yml'

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift test
        working-directory: ExamPilot
        run: swift test
      - name: Release build
        working-directory: ExamPilot
        run: swift build -c release
      - name: Repository verification
        run: python3 scripts/verify_all.py
