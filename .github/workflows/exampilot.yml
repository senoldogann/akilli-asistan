name: Repository

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository
        run: python3 scripts/verify_all.py
      - name: Test ZeroLose
        run: >-
          xcodebuild -project ZeroLose/ZeroLose.xcodeproj
          -scheme ZeroLose
          -destination 'platform=macOS'
          test CODE_SIGNING_ALLOWED=NO
