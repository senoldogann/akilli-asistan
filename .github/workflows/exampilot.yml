name: Repository

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test ZeroLose
        run: >-
          xcodebuild -project ZeroLose/ZeroLose.xcodeproj
          -scheme ZeroLose
          -destination 'platform=macOS'
          test CODE_SIGNING_ALLOWED=NO

      - name: Guard V2 legacy execution symbols
        shell: bash
        run: |
          set -euo pipefail
          root="ZeroLose/ZeroLose/V2"
          if git grep -nE '\[ACTION\]|extractActionsFromText|handleActions' -- "$root"; then
            echo "Legacy ACTION execution path found in ZeroLose V2."
            exit 1
          fi

      - name: Guard V2 forbidden runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          root="ZeroLose/ZeroLose/V2"
          if git grep -nE '\b(InputDriving|ExamPilot|GhostViewModel|ZeroOperator)\b' -- "$root"; then
            echo "Forbidden legacy/domain runtime dependency found in ZeroLose V2."
            exit 1
          fi

      - name: Guard V2 dynamic plugin loading
        shell: bash
        run: |
          set -euo pipefail
          root="ZeroLose/ZeroLose/V2"
          if git grep -nE '\b(dlopen|dlsym)\b|Bundle[^[:alnum:]_]*\(' -- "$root"; then
            echo "Dynamic plugin loading found in ZeroLose V2."
            exit 1
          fi

      - name: Guard changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Verify repository
        run: python3 scripts/verify_all.py
