name: Repository

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test ZeroLose
        run: >-
          xcodebuild -project ZeroLose/ZeroLose.xcodeproj
          -scheme ZeroLose
          -destination 'platform=macOS'
          test CODE_SIGNING_ALLOWED=NO

      - name: Verify V2 architecture guards
        shell: bash
        run: |
          set -euo pipefail

          if git grep -nE '\[ACTION:|handleActions' -- ZeroLose/ZeroLose/V2; then
            echo "Legacy ACTION execution path found in ZeroLose V2."
            exit 1
          fi

          if git grep -nE 'ExamPilot|InputDriving|GhostViewModel|ZeroOperator' -- ZeroLose/ZeroLose/V2; then
            echo "Forbidden legacy/domain runtime dependency found in ZeroLose V2."
            exit 1
          fi

          if git grep -nE 'dlopen|Bundle.*load' -- ZeroLose/ZeroLose/V2/Plugins; then
            echo "Dynamic plugin loading found in ZeroLose V2."
            exit 1
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check \
              "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Verify repository
        run: python3 scripts/verify_all.py
